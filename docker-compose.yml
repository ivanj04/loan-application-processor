version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: loandb
    environment:
      POSTGRES_DB: loandb
      POSTGRES_USER: loanuser
      POSTGRES_PASSWORD: loanpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanuser -d loandb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: loan-processor
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/loandb
      DATABASE_USERNAME: loanuser
      DATABASE_PASSWORD: loanpass
      JWT_SECRET: ${JWT_SECRET:-supersecretkey32charsminimumhere!}
      JWT_EXPIRATION_MS: 86400000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
