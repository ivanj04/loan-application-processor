spring:
  application:
    name: loan-application-processor
  profiles:
    active: dev
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  jwt:
    secret: supersecretkey32charsminimumhere!
    expiration-ms: 86400000

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/loandb}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:loanuser}
    password: ${DATABASE_PASSWORD:loanpass}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  jwt:
    secret: ${JWT_SECRET:supersecretkey32charsminimumhere!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
